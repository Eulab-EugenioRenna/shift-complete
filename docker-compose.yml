services:
  postgres:
    image: postgres:16-alpine
    container_name: shift-complete-postgres
    environment:
      POSTGRES_DB: shift_complete
      POSTGRES_USER: shift
      POSTGRES_PASSWORD: shift
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shift -d shift_complete"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shift-complete-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  s3:
    image: minio/minio:latest
    container_name: shift-complete-s3
    environment:
      MINIO_ROOT_USER: ${RESOURCE_S3_ACCESS_KEY:-shiftminio}
      MINIO_ROOT_PASSWORD: ${RESOURCE_S3_SECRET_KEY:-shiftminiosecret}
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3_data:/data

  s3-init:
    image: minio/mc:latest
    container_name: shift-complete-s3-init
    depends_on:
      s3:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://s3:9000 ${RESOURCE_S3_ACCESS_KEY:-shiftminio} ${RESOURCE_S3_SECRET_KEY:-shiftminiosecret}; do sleep 2; done &&
      mc mb --ignore-existing local/${RESOURCE_S3_BUCKET:-shift-complete-resources}
      "

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: shift-complete-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://shift:shift@postgres:5432/shift_complete?schema=public
      REDIS_URL: redis://redis:6379
      RUNNING_IN_DOCKER: 'true'
      RESOURCE_S3_ENDPOINT: http://s3:9000
    ports:
      - '3333:3333'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: shift-complete-web
    env_file:
      - .env
    environment:
      API_BASE_URL: /api
    ports:
      - '4200:80'
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./dist/apps/web/browser:/usr/share/nginx/html

volumes:
  postgres_data:
  redis_data:
  s3_data:
  api_node_modules:
