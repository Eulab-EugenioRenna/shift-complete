services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shift_complete}
      POSTGRES_USER: ${POSTGRES_USER:-shift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shift}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shift} -d ${POSTGRES_DB:-shift_complete}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  s3:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${RESOURCE_S3_ACCESS_KEY:-shiftminio}
      MINIO_ROOT_PASSWORD: ${RESOURCE_S3_SECRET_KEY:-shiftminiosecret}
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - s3_data:/data

  s3-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://s3:9000 ${RESOURCE_S3_ACCESS_KEY:-shiftminio} ${RESOURCE_S3_SECRET_KEY:-shiftminiosecret}; do sleep 2; done &&
      mc mb --ignore-existing local/${RESOURCE_S3_BUCKET:-shift-complete-resources}
      "

  api:
    build:
      context: .
      dockerfile: docker/api.prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-shift}:${POSTGRES_PASSWORD:-shift}@postgres:5432/${POSTGRES_DB:-shift_complete}?schema=public
      REDIS_URL: redis://redis:6379
      RUNNING_IN_DOCKER: 'true'
      RESOURCE_S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3333/api/logs/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - app_storage:/app/storage

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-8080}:80'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  s3_data:
  app_storage:
