    <div class="grid gap-4">
      <ui-form-section title="Anagrafica" subtitle="Dati personali e recapiti operativi.">
        <div class="grid gap-4 md:grid-cols-2">
          <ng-container *ngIf="showIdentityFields">
            <ui-field label="Nome completo">
              <ui-input [value]="profileForm.fullName" (valueChange)="profileForm.fullName = $event" placeholder="Nome e cognome"></ui-input>
            </ui-field>
            <ui-field label="Email">
              <ui-input [value]="profileForm.email" (valueChange)="profileForm.email = $event" placeholder="nome@dominio.it" autocomplete="email"></ui-input>
            </ui-field>
          </ng-container>
          <ui-field label="Telefono">
            <ui-input [value]="profileForm.phone" (valueChange)="profileForm.phone = $event" placeholder="+39 ..."></ui-input>
          </ui-field>
          <ui-field label="Indirizzo">
            <ui-input [value]="profileForm.address" (valueChange)="profileForm.address = $event" placeholder="Via e citta"></ui-input>
          </ui-field>
          <ui-field label="Contatto emergenza">
            <ui-input [value]="profileForm.emergencyName" (valueChange)="profileForm.emergencyName = $event" placeholder="Nome e cognome"></ui-input>
          </ui-field>
          <ui-field label="Telefono emergenza">
            <ui-input [value]="profileForm.emergencyPhone" (valueChange)="profileForm.emergencyPhone = $event" placeholder="+39 ..."></ui-input>
          </ui-field>
        </div>
      </ui-form-section>

      <ui-form-section title="Preferenze" subtitle="Turni, competenze, team e mansioni preferite.">
        <div class="grid gap-4 md:grid-cols-2">
      <ui-multi-select label="Preferenze turni" [options]="shiftPreferenceOptions" [value]="profileForm.preferredShifts" (valueChange)="setShiftPreferences($event)" placeholder="Seleziona preferenze turno"></ui-multi-select>
      <ui-multi-select label="Competenze" [options]="competencyOptions" [value]="profileForm.competencies" (valueChange)="setCompetencies($event)" placeholder="Seleziona competenze"></ui-multi-select>
      <ui-multi-select *ngIf="locationPreferenceOptions.length" label="Luoghi preferiti" [options]="locationPreferenceOptions" [value]="profileForm.preferredLocationValues" (valueChange)="setPreferredLocations($event)" placeholder="Seleziona luoghi"></ui-multi-select>
      <ui-multi-select *ngIf="teamPreferenceOptions.length" label="Team preferiti" [options]="teamPreferenceOptions" [value]="profileForm.preferredTeamIds" (valueChange)="setPreferredTeams($event)" placeholder="Seleziona team"></ui-multi-select>
      <ui-multi-select *ngIf="dutyPreferenceOptions.length" label="Mansioni preferite" [options]="dutyPreferenceOptions" [value]="profileForm.preferredDutyIds" (valueChange)="setPreferredDuties($event)" placeholder="Seleziona mansioni"></ui-multi-select>
      <div class="md:col-span-2">
        <p class="mb-2 text-xs text-[color:var(--text-3)]">Clicca una chip per rimuoverla.</p>
        <div class="flex flex-wrap gap-2">
        <ui-chip *ngFor="let item of profileForm.preferredShifts" tone="neutral" (chipClick)="removeShiftPreference(item)" title="Rimuovi preferenza turno">{{ shiftLabel(item) }} <i class="pi pi-times text-[10px]"></i></ui-chip>
        <ui-chip *ngFor="let item of profileForm.competencies" tone="neutral" (chipClick)="removeCompetency(item)" title="Rimuovi competenza">{{ competencyLabel(item) }} <i class="pi pi-times text-[10px]"></i></ui-chip>
        <ui-chip *ngFor="let item of profileForm.preferredLocationValues" tone="neutral" (chipClick)="removePreferredLocation(item)" title="Rimuovi luogo preferito">Luogo: {{ locationLabel(item) }} <i class="pi pi-times text-[10px]"></i></ui-chip>
        <ui-chip *ngFor="let item of selectedTeamLabels()" tone="neutral" (chipClick)="removePreferredTeamByLabel(item)" title="Rimuovi team preferito">Team: {{ item }} <i class="pi pi-times text-[10px]"></i></ui-chip>
        <ui-chip *ngFor="let item of selectedDutyLabels()" tone="neutral" (chipClick)="removePreferredDutyByLabel(item)" title="Rimuovi mansione preferita">Mansione: {{ item }} <i class="pi pi-times text-[10px]"></i></ui-chip>
        </div>
      </div>
        </div>
      </ui-form-section>

      <ui-form-section title="Note servizio" subtitle="Preferenze operative, certificazioni e contesto.">
        <ui-field label="Note servizio">
          <ui-textarea [value]="profileForm.serviceNotes" (valueChange)="profileForm.serviceNotes = $event" placeholder="Preferenze, note operative, certificazioni"></ui-textarea>
        </ui-field>
      </ui-form-section>
    </div>
    <div class="mt-4 flex justify-end" *ngIf="showSubmit">
      <ui-button tone="info" [disabled]="saving" (buttonClick)="save.emit()">{{ saving ? 'Salvataggio...' : submitLabel }}</ui-button>
    </div>
