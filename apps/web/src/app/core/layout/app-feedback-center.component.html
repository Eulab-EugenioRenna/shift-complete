<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-full max-w-sm flex-col gap-3">
  <div class="pointer-events-auto flex justify-end" *ngIf="feedback.items().length > 1">
    <ui-chip tone="neutral" class="shadow-[var(--shadow-soft)]" (chipClick)="feedback.clearAll()">Pulisci tutto</ui-chip>
  </div>
  <article
    *ngFor="let item of feedback.items()"
    class="pointer-events-auto overflow-hidden rounded-2xl border shadow-[var(--shadow-soft)]"
    [ngClass]="cardClasses(item)"
  >
    <div class="flex items-start gap-3 px-4 py-3">
      <div class="mt-0.5 flex h-8 w-8 items-center justify-center rounded-full" [ngClass]="iconClasses(item)">
        <i class="pi"
          [class.pi-check]="item.type === 'success'"
          [class.pi-times]="item.type === 'error'"
          [class.pi-info]="item.type === 'info'"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold" [ngClass]="titleClasses(item)">{{ item.title }}</p>
        <p *ngIf="item.message" class="mt-1 text-sm" [ngClass]="messageClasses(item)">{{ item.message }}</p>
      </div>
      <button type="button" class="transition" [ngClass]="dismissClasses(item)" (click)="feedback.dismiss(item.id)">
        <i class="pi pi-times"></i>
      </button>
    </div>
  </article>
</div>
