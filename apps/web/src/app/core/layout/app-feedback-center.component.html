<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-full max-w-sm flex-col gap-3">
  <div class="pointer-events-auto flex justify-end" *ngIf="feedback.items().length > 1">
    <button type="button" class="rounded-full border border-slate-200 bg-white/95 px-3 py-1.5 text-xs font-medium text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:bg-slate-900/95 dark:text-slate-300 dark:hover:border-slate-600 dark:hover:text-slate-100" (click)="feedback.clearAll()">
      Pulisci tutto
    </button>
  </div>
  <article
    *ngFor="let item of feedback.items()"
    class="pointer-events-auto overflow-hidden rounded-2xl border shadow-lg backdrop-blur"
    [class.border-emerald-200]="item.type === 'success'"
    [ngClass]="{
      'bg-emerald-50 dark:bg-emerald-950/70': item.type === 'success',
      'bg-red-50 dark:bg-red-950/70': item.type === 'error',
      'bg-white dark:bg-slate-900': item.type === 'info'
    }"
    [ngClass]="item.type === 'success' ? 'border-emerald-200 dark:border-emerald-900' : item.type === 'error' ? 'border-red-200 dark:border-red-900' : 'border-slate-200 dark:border-slate-700'"
  >
    <div class="flex items-start gap-3 px-4 py-3">
      <div class="mt-0.5 flex h-8 w-8 items-center justify-center rounded-full"
        [ngClass]="item.type === 'success' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900 dark:text-emerald-200' : item.type === 'error' ? 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-200' : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200'"
      >
        <i class="pi"
          [class.pi-check]="item.type === 'success'"
          [class.pi-times]="item.type === 'error'"
          [class.pi-info]="item.type === 'info'"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ item.title }}</p>
        <p *ngIf="item.message" class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{ item.message }}</p>
      </div>
      <button type="button" class="text-slate-400 transition hover:text-slate-700 dark:text-slate-500 dark:hover:text-slate-200" (click)="feedback.dismiss(item.id)">
        <i class="pi pi-times"></i>
      </button>
    </div>
  </article>
</div>
